<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore premium graphic designing, digital printing, Xerox, flex banners, visiting cards, calendars, bill books, social media posters and video editing services at Ruchita Graphics, Ghanpur.">

    <title>Our Services | Ruchita Graphics</title>

    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --main: #16a34a;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(0, 123, 255, 0.05), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 0, 180, 0.05), transparent 30%),
                var(--bg);
            color: var(--ink);
            line-height: 1.6;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .wrap {
            max-width: 1250px;
            margin: auto;
            padding: 0 20px;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
            text-decoration: none;
            color: var(--ink);
            white-space: nowrap;
        }

        .brand img {
            height: 45px !important;
            width: auto !important;
            object-fit: contain !important;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-weight: 650;
            margin-left: 24px;
            transition: 0.25s ease;
        }

        nav a:hover,
        nav a.active {
            color: var(--main);
        }

        /* =========================
           PAGE TITLE
        ========================= */

        .section-title {
            text-align: center;
            padding: 48px 15px 35px;
        }

        .section-title h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 850;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .section-title p {
            color: var(--muted);
            font-size: 16px;
            max-width: 750px;
            margin: auto;
        }

        .title-line {
            width: 90px;
            height: 4px;
            margin: 18px auto 0;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                #ff0080,
                #007bff,
                #00d4ff,
                #ff7a00
            );
        }

        /* =========================
           SERVICES
        ========================= */

        .services-container {
            max-width: 1200px;
            margin: 0 auto 70px;
            padding: 0 20px;
        }

        .service-box {
            position: relative;
            margin-bottom: 42px;
            background: #ffffff;
            padding: 12px;
            border-radius: 24px;

            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.10),
                0 2px 8px rgba(15, 23, 42, 0.05);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }

        .service-box:hover {
            transform: translateY(-6px);

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.16),
                0 4px 12px rgba(15, 23, 42, 0.07);
        }

        .service-box img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 18px;
            object-fit: contain;
        }

        /* Subtle coloured glow around each box */

        .service-box:nth-child(1) {
            box-shadow:
                0 12px 35px rgba(255, 122, 0, 0.14),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .service-box:nth-child(2) {
            box-shadow:
                0 12px 35px rgba(0, 123, 255, 0.14),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .service-box:nth-child(3) {
            box-shadow:
                0 12px 35px rgba(0, 180, 255, 0.14),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .service-box:nth-child(4) {
            box-shadow:
                0 12px 35px rgba(114, 9, 183, 0.14),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .service-box:nth-child(5) {
            box-shadow:
                0 12px 35px rgba(108, 117, 125, 0.16),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        .service-box:nth-child(6) {
            box-shadow:
                0 12px 35px rgba(247, 37, 133, 0.14),
                0 2px 8px rgba(15, 23, 42, 0.05);
        }

        /* =========================
           BOX NUMBER BADGE
        ========================= */

        .service-number {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 5;

            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(15, 23, 42, 0.85);
            color: white;

            font-size: 20px;
            font-weight: 900;

            border: 2px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);

            opacity: 0;
            transition: 0.3s ease;
        }

        .service-box:hover .service-number {
            opacity: 1;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 22px 15px;
            font-size: 14px;
            margin-top: 20px;
        }

        /* =========================
           WHATSAPP BUTTON
        ========================= */

        .whatsapp-button {
            position: fixed;
            bottom: 22px;
            right: 22px;

            width: 62px;
            height: 62px;

            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #25d366;
            border-radius: 50%;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.28);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            text-decoration: none;
        }

        .whatsapp-button:hover {
            transform: scale(1.12);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .whatsapp-button svg {
            width: 35px;
            height: 35px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .nav-container {
                flex-direction: column;
                gap: 10px;
            }

            .brand {
                font-size: 19px;
            }

            .brand img {
                height: 40px !important;
            }

            nav {
                text-align: center;
                line-height: 2;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .section-title {
                padding: 35px 15px 25px;
            }

            .section-title h1 {
                font-size: 28px;
            }

            .services-container {
                padding: 0 10px;
            }

            .service-box {
                padding: 6px;
                border-radius: 17px;
                margin-bottom: 25px;
            }

            .service-box img {
                border-radius: 13px;
            }

            .service-number {
                width: 38px;
                height: 38px;
                top: 15px;
                left: 15px;
                font-size: 17px;
            }

            .whatsapp-button {
                width: 56px;
                height: 56px;
                right: 16px;
                bottom: 16px;
            }

            .whatsapp-button svg {
                width: 31px;
                height: 31px;
            }
        }
    </style>
</head>
