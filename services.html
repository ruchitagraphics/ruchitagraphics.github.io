<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services | Ruchita Graphics</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }

        /* =========================
           HEADER - MASTER FROM INDEX
        ========================== */

        header {
            width: 100%;
            background-color: #002060;
        }

        .wrap {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-container {
            min-height: 90px;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .brand img {
            height: 65px;
            width: 65px;
            display: block;
            object-fit: contain;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover,
        nav a.active {
            border-bottom: 2px solid white;
        }


        /* =========================
           SERVICES TITLE
           ORIGINAL CONTENT - UNCHANGED
        ========================== */

        .services-heading {
            padding: 40px 20px 20px;
        }

        .services-heading h1 {
            margin: 0 0 10px;
            font-size: 34px;
            color: #002060;
            font-weight: 700;
        }

        .services-heading p {
            margin: 0 auto;
            max-width: 850px;
            font-size: 16px;
            line-height: 1.6;
            color: #555;
        }


        /* =========================
           SERVICE BOXES
           ORIGINAL CONTENT - UNCHANGED
        ========================== */

        .services-container {
            width: 100%;
            max-width: 1150px;
            margin: 25px auto 60px;
            padding: 0 20px;
        }

        .service-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 30px;

            border: 1px solid #e1e6ec;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .service-box:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 32px rgba(0, 0, 0, 0.16);
        }

        .service-box img {
            width: 100%;
            height: auto;
            display: block;

            border-radius: 9px;
        }


        /* =========================
           WHATSAPP BUTTON
           ORIGINAL - UNCHANGED
        ========================== */

        .whatsapp-float {
            position: fixed;
            right: 22px;
            bottom: 22px;

            width: 58px;
            height: 58px;

            background: #25D366;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            font-size: 30px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.25);

            z-index: 9999;

            transition: transform 0.25s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }


        /* =========================
           FOOTER - MASTER FROM INDEX
        ========================== */

        footer {
            background: #002060;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 14px;
        }

        footer p {
            margin: 0;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {

            .nav-container {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .brand {
                font-size: 20px;
            }

            .brand img {
                width: 58px;
                height: 58px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .services-heading {
                padding: 30px 15px 15px;
            }

            .services-heading h1 {
                font-size: 28px;
            }

            .services-heading p {
                font-size: 15px;
            }

            .services-container {
                padding: 0 12px;
                margin-top: 20px;
            }

            .service-box {
                padding: 6px;
                margin-bottom: 20px;
                border-radius: 10px;
            }

            .whatsapp-float {
                width: 52px;
                height: 52px;
                right: 16px;
                bottom: 16px;
                font-size: 27px;
            }
        }


        @media (max-width: 480px) {

            .brand {
                font-size: 18px;
            }

            .brand img {
                height: 45px;
                width: 45px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .services-heading h1 {
                font-size: 25px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================

        <div class="wrap nav-container">

            <a href="index.html" class="brand">

                <span>RUCHITA GRAPHICS</span>

            </a>

            <nav>

                <a href="services.html" class="active">

                <a href="contact.html">

    <section class="services-heading">

        <p>

        </p>

    </section>

        </div>


        <!-- BOX 4 -->

            <img src="assets/box-4.webp"

        <!-- BOX 5 -->
        <div class="service-box">

            <img src="assets/box-5.webp"

        </div>


        <!-- BOX 6 -->
        <div class="service-box">

            <img src="assets/box-6.webp"

        </div>

    </main>


    <!-- =========================
         WHATSAPP
         ORIGINAL - UNCHANGED
    ========================== -->

    <a href="https://wa.me/917799036524"
       class="whatsapp-float"
       target="_blank"
       aria-label="Chat with Ruchita Graphics on WhatsApp">

        <i class="fa-brands fa-whatsapp"></i>

    </a>


    <!-- =========================
         FOOTER
         MASTER FROM INDEX.HTML
    ========================== -->

    <footer>

        <p>
            &copy; 2026 Ruchita Graphics. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
