<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Ruchita Graphics</title>
    <!-- CSS ఫైల్ లింక్ (మీ assets ఫోల్డర్ లోని ఫైల్ పేరుతో సరిచూసుకోండి) -->
    <link rel="stylesheet" href="assets/style.css">
    
    <style>
        /* కాంటాక్ట్ పేజీకి సంబంధించిన ప్రత్యేక డిజైన్ స్టైల్స్ */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        
        /* మెనూ బార్ స్టైల్ */
        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 16px;
        }
        nav a:hover {
            background-color: #555;
            border-radius: 4px;
        }

        /* కాంటాక్ట్ కంటెంట్ బాక్స్ */
        .contact-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 4px 30px 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }
        .contact-container h1 {
            color: #333;
            margin-top: 30px;
        }
        .contact-container p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        /* బటన్ల కంటైనర్ */
        .contact-buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
            align-items: center;
        }

        /* కాంటాక్ట్ బటన్ల జనరల్ స్టైల్ */
        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 80%;
            max-width: 300px;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn-contact img {
            width: 24px;
            height: 24px;
        }

        /* బటన్ కలర్స్ */
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-email {
            background-color: #EA4335;
        }

        /* --- స్క్రీన్ కుడివైపు కింద ఉండే WhatsApp ఫ్లోటింగ్ బటన్ స్టైల్ --- */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .whatsapp-icon {
            color: #ffffff; 
        }
        .whatsapp-float:hover {
            background-color: #128c7e;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- నావిగేషన్ మెనూ (లింకులు పర్‌ఫెక్ట్‌గా ఉన్నాయి) -->
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- కాంటాక్ట్ పేజీ ప్రధాన సమాచారం -->
    <div class="contact-container">
        <h1>మమ్మల్ని సంప్రదించండి</h1>
        <p>మీకు ఏవైనా సందేహాలు ఉన్నా లేదా మరిన్ని వివరాలు తెలుసుకోవాలన్నా కింద ఉన్న బటన్ల ద్వారా మమ్మల్ని నేరుగా సంప్రదించవచ్చు.</p>
        
        <div class="contact-buttons-wrapper">
            <!-- వాట్సాప్ బటన్ -->
            <a href="https://wa.me" class="btn-contact btn-whatsapp" target="_blank" rel="noopener noreferrer">
                <img src="https://wikimedia.org" alt="WhatsApp">
                WhatsApp Chat
            </a>

            <!-- ఈమెయిల్ బటన్ -->
            <a href="mailto:ruchitagraphics@gmail.com" class="btn-contact btn-email">
                <img src="https://wikimedia.org" alt="Email">
                Email Us
            </a>
        </div>
    </div>

    <!-- స్క్రీన్ కుడివైపు కింద ఉండే పర్‌ఫెక్ట్ వాట్సాప్ ఫ్లోటింగ్ బటన్ (SVG Icon) -->
    <a href="https://wa.me" class="whatsapp-float" target="_blank" rel="noopener noreferrer">
        <svg class="whatsapp-icon" xmlns="http://w3.org" viewBox="0 0 448 512" width="30" height="30" fill="currentColor">
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
        </svg>
    </a>

</body>
</html>
