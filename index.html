<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruchita Graphics | Ghanpur Station</title>
    <style>
        /* - Corrected CSS Structure for Contact Section */
        :root { --main: #16a34a; --ink: #0f172a; }
        body { font-family: sans-serif; background: #f8fafc; }
        .contact-box-container { max-width: 500px; margin: 30px auto; padding: 0 15px; }
        .contact-info-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .contact-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .contact-icon { font-size: 24px; background: #f0fdf4; padding: 10px; border-radius: 12px; }
        .contact-details a { color: var(--main); text-decoration: none; font-weight: 700; }
        .btn.green { display: inline-block; padding: 12px 18px; background: #16a34a; color: white; text-decoration: none; border-radius: 999px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="contact-box-container">
        <div class="contact-info-card">
            <h3>Contact Us</h3>
            <div class="contact-item">
                <span class="contact-icon">📞</span>
                <div class="contact-details"><strong>Phone</strong><br><a href="tel:+919441536524">+91 94415 36524</a></div>
            </div>
            <div class="contact-item">
                <span class="contact-icon">💬</span>
                <div class="contact-details"><strong>WhatsApp</strong><br><a href="https://wa.me" target="_blank">+91 77990 36524</a></div>
            </div>
            <a href="https://wa.me" class="btn green" target="_blank">Chat on WhatsApp</a>
        </div>
    </div>
</body>
</html>
