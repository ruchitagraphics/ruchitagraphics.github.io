<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Portfolio | Ruchita Graphics</title>

    <style>
        :root {
            --main: #16a34a;
            --ink: #0f172a;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* MASTER HEADER */
        header {
            width: 100%;
            background-color: #002060;
        }

        .nav-container {
            min-height: 90px;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .brand img {
            height: 65px;
            width: 65px;
            display: block;
            object-fit: contain;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover,
        nav a.active {
            border-bottom: 2px solid white;
        }

        /* PORTFOLIO CONTENT */
        .section-title {
            text-align: center;
            margin: 40px 0;
        }

        .section-title h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #64748b;
        }

        .portfolio-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .portfolio-gallery img {
            width: 100%;
            max-width: 950px;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        /* ORDER / CONTACT BUTTON */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 250px;
            padding: 14px 30px;
            margin: 0 auto 20px;
            background: #f39c12;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 30px;
            box-shadow: 0 5px 10px rgba(243,156,18,0.25);
            transition: 0.3s;
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(243,156,18,0.32);
        }

        .contact-btn-wrap {
            text-align: center;
            margin-bottom: 20px;
        }

     /* PREVIOUS PAGE BUTTON */

.previous-page-wrap {
    text-align: left;
    margin-top: 10px;
    margin-bottom: 20px;
}

.previous-page {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 220px;
    height: 50px;
    padding: 0 25px;
    background-color: #6b7280;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    border-radius: 30px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.12);
    transition: 0.3s;
}

.previous-page:hover {
    transform: translateY(-2px);
    background-color: #4b5563;
    box-shadow: 0 6px 12px rgba(0,0,0,0.18);
}

        .previous-page:hover {
            transform: translateX(-6px);
        }

        /* MASTER FOOTER */
        footer {
            background: #002060;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 14px;
        }

        footer p {
            margin: 0;
        }

        /* MASTER MOBILE HEADER */
        @media (max-width: 768px) {

            .nav-container {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .brand {
                font-size: 20px;
            }

            .brand img {
                width: 58px;
                height: 58px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .contact-btn {
                width: 90%;
                min-width: 0;
            }

            .previous-page-wrap {
                margin-left: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- MASTER HEADER -->
    <header>
        <div class="wrap nav-container">

            <a href="index.html" class="brand">
                <img src="assets/RUCHITA_NEW_LOGO.webp" alt="Logo">
                <span>RUCHITA GRAPHICS</span>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="gallery.html">Gallery</a>

                <a href="contact.html">Contact</a>
            </nav>

        </div>

    <!-- PORTFOLIO CONTENT -->
    <div class="wrap">

        <div class="section-title">
            <h1>Our Featured Work</h1>
            <p>Take a look at some of our templates and recently completed projects.</p>
        </div>


        <div class="portfolio-gallery">

            <img src="assets/RGFX%20NEW%20YEAR%20CALENDARS.jpg"
                 alt="Featured Calendar Work">

            <!-- కొత్తగా యాడ్ చేసే ఫోటోలను భవిష్యత్తులో ఈ కింద లైన్ లో యాడ్ చేసుకోవచ్చు -->

        </div>


        <!-- ORDER / CONTACT US -->
        <div class="contact-btn-wrap">
            <a href="contact.html" class="contact-btn">
                ORDER / CONTACT US&nbsp; →
            </a>
        </div>


        <!-- ONLY PREVIOUS PAGE -->
        <div class="previous-page-wrap">
            <a href="gallery.html" class="previous-page">
                ← PREVIOUS PAGE
            </a>
        </div>

    </footer>
